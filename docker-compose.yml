services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - .:/var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=salonflow
    networks:
      - default
      - locnet

  webserver:
    image: nginx:1.27-alpine
    ports:
      - "8095:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  queue:
    build:
      context: .
      target: dev
    command: php artisan queue:work --tries=3
    volumes:
      - .:/var/www/html
    networks:
      - default
      - locnet

  vite:
    image: node:22-alpine
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"

networks:
  locnet:
    external: true
